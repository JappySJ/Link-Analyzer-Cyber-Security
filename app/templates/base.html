<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Link Threat Analysis Tool - intelligent web-based phishing detection combining weighted heuristic rules with a trained machine-learning model.">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128737;</text></svg>">
</head>
<body>
  <!-- Navigation / request progress bar (driven by app.js) -->
  <div class="nav-progress" id="navProgress" role="progressbar"
       aria-hidden="true" aria-label="Loading"></div>

  <!-- Decorative background layers: radial glow + faint grid -->
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="{{ app_name }} home">
        <span class="brand-mark" aria-hidden="true">
          <!-- Shield with a link glyph inside -->
          <svg viewBox="0 0 32 32" width="32" height="32" role="img" aria-hidden="true">
            <defs>
              <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#22D3EE"/>
                <stop offset="100%" stop-color="#818CF8"/>
              </linearGradient>
            </defs>
            <path d="M16 2.5 4.5 7v9.2c0 7.2 4.9 11.9 11.5 13.9 6.6-2 11.5-6.7 11.5-13.9V7L16 2.5Z"
                  fill="url(#shieldGrad)" opacity="0.16"/>
            <path d="M16 2.5 4.5 7v9.2c0 7.2 4.9 11.9 11.5 13.9 6.6-2 11.5-6.7 11.5-13.9V7L16 2.5Z"
                  fill="none" stroke="url(#shieldGrad)" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M13.4 18.6a3.2 3.2 0 0 1 0-4.5l1.9-1.9a3.2 3.2 0 0 1 4.5 4.5l-.8.8"
                  fill="none" stroke="#22D3EE" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M18.6 13.4a3.2 3.2 0 0 1 0 4.5l-1.9 1.9a3.2 3.2 0 0 1-4.5-4.5l.8-.8"
                  fill="none" stroke="#A5F3FC" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">LTAT</span>
          <span class="brand-tagline">Link Threat Analysis</span>
        </span>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a href="/"          class="nav-link {% if active == 'analyze'   %}is-active{% endif %}" {% if active == 'analyze'   %}aria-current="page"{% endif %}>Analyze</a>
        <a href="/history"   class="nav-link {% if active == 'history'   %}is-active{% endif %}" {% if active == 'history'   %}aria-current="page"{% endif %}>History</a>
        <a href="/dashboard" class="nav-link {% if active == 'dashboard' %}is-active{% endif %}" {% if active == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
      </nav>

      <div class="status-pill" id="statusPill" role="status" aria-live="polite" title="System status">
        <span class="status-dot is-loading" id="statusDot" aria-hidden="true"></span>
        <span class="status-text" id="statusText">Checking&hellip;</span>
      </div>
    </div>
  </header>

  <main class="container page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-text">
        <strong>{{ app_name }}</strong> &middot; v{{ version }} &middot;
        Group 09, Bhilai Institute of Technology, Durg
      </p>
      <p class="footer-note">
        Runs entirely on <code>127.0.0.1</code>. Scores are advisory &mdash; always verify a link independently.
      </p>
    </div>
  </footer>

  <!-- Toast container: errors render here, never as alert() -->
  <div class="toast-stack" id="toastStack" aria-live="assertive" aria-atomic="true"></div>

  <script>
    // Thresholds come from config.py so the UI and the engine can never disagree.
    window.LTAT = {
      THRESHOLD_SAFE: {{ threshold_safe }},
      THRESHOLD_MALICIOUS: {{ threshold_malicious }},
      VERSION: "{{ version }}"
    };
  </script>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
